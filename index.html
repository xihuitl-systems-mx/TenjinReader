<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Folentra PDF: lector y editor PDF ligero con visor de presentaciones."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://127.0.0.1:*; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" content="#f7f7f4" />
    <title>Folentra PDF</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Saltar al documento</a>

    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="i-folder-open" viewBox="0 0 24 24">
        <path d="M3.5 7.5v10a2 2 0 0 0 2 2h11.7a2 2 0 0 0 1.9-1.4l2.2-7a1.5 1.5 0 0 0-1.4-2H8.5l-2-2.6h-2a1 1 0 0 0-1 1Z" />
      </symbol>
      <symbol id="i-save" viewBox="0 0 24 24">
        <path d="M5 3.5h11l3.5 3.6v13.4h-15a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1Z" />
        <path d="M8 3.5v6h7v-6M8 20.5v-7h8v7" />
      </symbol>
      <symbol id="i-save-as" viewBox="0 0 24 24">
        <path d="M4.5 3.5h10.8l3.2 3.3v5.7M7.5 3.5v6h7v-6M7.5 20.5v-7h7" />
        <path d="m14.3 19.9 5.6-5.6 1.8 1.8-5.6 5.6-2.4.6.6-2.4Z" />
      </symbol>
      <symbol id="i-cursor" viewBox="0 0 24 24">
        <path d="m5 3.5 13.6 9.2-6 .9-3.1 5.2L5 3.5Z" />
      </symbol>
      <symbol id="i-text" viewBox="0 0 24 24">
        <path d="M5 5.5v-2h14v2M12 3.5v17M8.5 20.5h7" />
      </symbol>
      <symbol id="i-form-field" viewBox="0 0 24 24">
        <rect x="3.5" y="6" width="17" height="12" rx="1.5" />
        <path d="M7 10h10M7 14h6" />
      </symbol>
      <symbol id="i-highlight" viewBox="0 0 24 24">
        <path d="m14.8 4.1 5.1 5.1L10 19.1H4.9v-5.2l9.9-9.8Z" />
        <path d="m12.4 6.5 5.1 5.1M3 21h10" />
      </symbol>
      <symbol id="i-ink" viewBox="0 0 24 24">
        <path d="M4 18.8c3.4-1 4.2-5.7 6.5-9.1 1.7-2.6 3.4-3.2 4.2-2.3 1.4 1.7-3.4 7.8-2.1 9.2 1.1 1.2 3.1-2.8 4.3-2.2 1 .5-.4 2.6.5 3.2.8.5 1.8-.8 2.6-1.2" />
      </symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24">
        <path d="m14.9 4.2 5 5a1.4 1.4 0 0 1 0 2L11 20H6.5l-3-3a1.4 1.4 0 0 1 0-2l9.4-10.8a1.4 1.4 0 0 1 2 0Z" />
        <path d="m8.3 9.5 6.2 6.2M10.8 20h9.7" />
      </symbol>
      <symbol id="i-undo" viewBox="0 0 24 24">
        <path d="m8.5 7.2-4 4 4 4" />
        <path d="M5 11.2h7.5a6 6 0 0 1 6 6v1" />
      </symbol>
      <symbol id="i-rotate" viewBox="0 0 24 24">
        <path d="M19 8.5V4l-2 2a8 8 0 1 0 2.3 8" />
        <path d="M13.5 3.5 19 4" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4.5 7h15M9 3.5h6l1 3.5H8l1-3.5ZM7 7l.7 13.5h8.6L17 7M10 10.5v6M14 10.5v6" />
      </symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24">
        <path d="m14.5 6-6 6 6 6" />
      </symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24">
        <path d="m9.5 6 6 6-6 6" />
      </symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6" />
      </symbol>
      <symbol id="i-minus" viewBox="0 0 24 24">
        <path d="M5 12h14" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M5 12h14M12 5v14" />
      </symbol>
      <symbol id="i-fit" viewBox="0 0 24 24">
        <path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5" />
        <path d="M8 8h8v8H8z" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.8" cy="10.8" r="6.3" />
        <path d="m15.5 15.5 4.2 4.2" />
      </symbol>
      <symbol id="i-document" viewBox="0 0 24 24">
        <path d="M6 2.8h8l4 4v14.4H6z" />
        <path d="M14 2.8v4h4M9 11h6M9 15h6" />
      </symbol>
      <symbol id="i-feather" viewBox="0 0 24 24">
        <path d="M20.5 3.5c-6.7.1-12.6 3.4-15.1 8.3-1.2 2.3-1 4.8.5 6.3 1.4 1.4 3.8 1.1 5.9-.1 4.7-2.8 7.7-8.2 8.7-14.5Z" />
        <path d="M4 21c3.3-5.8 7.2-9.5 12.8-12.8M7.5 14.2l.1-4.4M11.1 10.5l4.7-.1" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m6.5 6.5 11 11M17.5 6.5l-11 11" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 12.5 4.2 4.2L19 7" />
      </symbol>
      <symbol id="i-convert" viewBox="0 0 24 24">
        <path d="M7 7h11l-3-3M18 7l-3 3M17 17H6l3 3M6 17l3-3" />
      </symbol>
      <symbol id="i-organize" viewBox="0 0 24 24">
        <path d="M7 4h11v14H7zM4 7h3v13h11v-2M10 8h5M10 11h5M10 14h3" />
      </symbol>
      <symbol id="i-signature" viewBox="0 0 24 24">
        <path d="M3.5 17.5c2.6-.3 4.4-2.5 5.8-5.7 1.2-2.8 2.4-5 3.7-4.4 2.2 1-2.9 8.3-.5 9.1 1.6.5 2.5-3.4 3.9-2.7 1 .5.1 2.3 1.2 2.7.9.3 1.8-.4 2.9-1.1M4 20h16" />
      </symbol>
      <symbol id="i-merge" viewBox="0 0 24 24">
        <path d="M5 3.5h8v6H5zM5 14.5h8v6H5zM16 7v10M13 12h7" />
      </symbol>
      <symbol id="i-split" viewBox="0 0 24 24">
        <path d="M8 3.5h8v17H8zM4 12h16M4 8l4 4-4 4M20 8l-4 4 4 4" />
      </symbol>
      <symbol id="i-compress" viewBox="0 0 24 24">
        <path d="M8 3.5H3.5V8M16 3.5h4.5V8M8 20.5H3.5V16M16 20.5h4.5V16M3.5 8 9 13.5M20.5 8 15 13.5M3.5 16 9 10.5M20.5 16 15 10.5" />
      </symbol>
      <symbol id="i-unlock" viewBox="0 0 24 24">
        <rect x="5" y="10.5" width="14" height="10" rx="2" />
        <path d="M8.5 10.5V7.8a3.8 3.8 0 0 1 7.2-1.7M12 14.5v2.7" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="5" y="10.5" width="14" height="10" rx="2" />
        <path d="M8.5 10.5V7.8a3.5 3.5 0 0 1 7 0v2.7M12 14.5v2.7" />
      </symbol>
    </svg>

    <div id="app" class="app-shell" data-document-type="none">
      <header class="topbar" aria-label="Barra principal">
        <div class="brand">
          <img class="brand-mark" src="/icon.svg" alt="" width="28" height="28" />
          <span class="brand-name">Folentra PDF</span>
        </div>

        <div class="document-identity" aria-live="polite">
          <button
            id="document-title"
            class="document-title"
            type="button"
            aria-label="Nombre del documento"
            title="Haz clic para cambiar el nombre"
            disabled
          >Sin documento</button>
          <input
            id="document-title-input"
            class="document-title-input"
            type="text"
            maxlength="255"
            spellcheck="false"
            autocomplete="off"
            aria-label="Nuevo nombre del documento"
            hidden
          />
          <span id="dirty-indicator" class="dirty-indicator" hidden aria-label="Cambios sin guardar"></span>
          <span id="file-meta" class="file-meta" hidden></span>
          <span id="file-kind" class="file-kind" hidden></span>
          <span id="readonly-badge" class="readonly-badge" hidden>
            <span class="readonly-dot" aria-hidden="true"></span>
            <span id="readonly-label">Solo lectura</span>
          </span>
        </div>

        <div class="file-actions">
          <input
            id="file-input"
            class="visually-hidden"
            type="file"
            accept=".pdf,.ppt,.pptx,.odp,.odf,application/pdf,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.oasis.opendocument.presentation,application/vnd.oasis.opendocument.formula"
            aria-label="Seleccionar un PDF o una presentación compatible"
          />
          <button
            id="open-btn"
            class="button button-secondary"
            type="button"
            aria-label="Abrir documento"
            title="Abrir documento (Ctrl+O)"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-folder-open"></use></svg>
            <span>Abrir</span>
          </button>
          <div id="save-split" class="save-split">
            <button
              id="save-btn"
              class="button button-quiet save-primary"
              type="button"
              aria-label="Guardar PDF"
              title="Guardar PDF (Ctrl+S)"
              disabled
            >
              <svg class="icon" aria-hidden="true"><use href="#i-save"></use></svg>
              <span>Guardar</span>
            </button>
            <button
              id="save-menu-btn"
              class="button button-quiet save-menu-trigger"
              type="button"
              aria-label="Más opciones de guardado"
              aria-haspopup="menu"
              aria-controls="save-menu"
              aria-expanded="false"
              title="Más opciones de guardado"
              disabled
            >
              <svg class="icon" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
            </button>
            <div id="save-menu" class="save-menu" role="menu" aria-label="Opciones de guardado" hidden>
              <button
                id="save-as-btn"
                class="save-menu-item"
                type="button"
                role="menuitem"
                tabindex="-1"
                title="Guardar PDF como (Ctrl+Mayús+S)"
                disabled
              >
                <svg class="icon" aria-hidden="true"><use href="#i-save-as"></use></svg>
                <span>Guardar como…</span>
                <kbd>Ctrl+Mayús+S</kbd>
              </button>
            </div>
          </div>
          <button
            id="convert-btn"
            class="button button-quiet"
            type="button"
            aria-label="Convertir PDF"
            title="Convertir el PDF abierto"
            disabled
          >
            <svg class="icon" aria-hidden="true"><use href="#i-convert"></use></svg>
            <span>Convertir</span>
          </button>
        </div>
      </header>

      <div
        id="pdf-toolbar"
        class="pdf-toolbar"
        role="toolbar"
        aria-label="Controles del documento"
        hidden
      >
        <div class="toolbar-group edit-tools" aria-label="Edición">
          <button
            id="tool-select"
            class="tool-button is-active"
            type="button"
            title="Seleccionar (V)"
            aria-label="Seleccionar"
            aria-pressed="true"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-cursor"></use></svg>
          </button>
          <button
            id="tool-text"
            class="tool-button"
            type="button"
            title="Añadir texto (T)"
            aria-label="Añadir texto"
            aria-pressed="false"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-text"></use></svg>
          </button>
          <button
            id="tool-field"
            class="tool-button"
            type="button"
            title="Añadir campo rellenable AcroForm (F)"
            aria-label="Añadir campo rellenable AcroForm"
            aria-keyshortcuts="F"
            aria-pressed="false"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-form-field"></use></svg>
          </button>
          <button
            id="tool-highlight"
            class="tool-button"
            type="button"
            title="Resaltar (H)"
            aria-label="Resaltar"
            aria-pressed="false"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-highlight"></use></svg>
          </button>
          <button
            id="tool-ink"
            class="tool-button"
            type="button"
            title="Dibujar (D)"
            aria-label="Dibujar"
            aria-pressed="false"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-ink"></use></svg>
          </button>
          <button
            id="tool-eraser"
            class="tool-button"
            type="button"
            title="Borrar anotación (E)"
            aria-label="Borrar anotación"
            aria-pressed="false"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-eraser"></use></svg>
          </button>
        </div>

        <div id="style-controls" class="toolbar-group style-controls" aria-label="Estilo de anotación">
          <label class="color-picker" title="Color">
            <span class="visually-hidden">Color de anotación</span>
            <input id="color-control" type="color" value="#efb933" aria-label="Color de anotación" />
          </label>
          <label class="size-picker" title="Tamaño">
            <span class="size-label">Tamaño</span>
            <input
              id="size-control"
              type="range"
              min="1"
              max="24"
              value="3"
              step="1"
              aria-label="Tamaño de anotación"
            />
            <output id="size-value" for="size-control">3</output>
          </label>
        </div>

        <div class="toolbar-group history-tools" aria-label="Cambios">
          <button id="undo-btn" class="tool-button" type="button" title="Deshacer (Ctrl+Z)" aria-label="Deshacer" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-undo"></use></svg>
          </button>
          <button
            id="rotate-btn"
            class="tool-button tool-button-labeled rotate-page-button"
            type="button"
            title="Rotar página 90° a la derecha (R)"
            aria-label="Rotar página 90° a la derecha"
            aria-keyshortcuts="R"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-rotate"></use></svg>
            <span>Rotar 90°</span>
          </button>
          <button id="delete-btn" class="tool-button danger" type="button" title="Eliminar página" aria-label="Eliminar página" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-trash"></use></svg>
          </button>
        </div>

        <div class="toolbar-group document-tools" aria-label="Herramientas PDF">
          <button
            id="organize-btn"
            class="tool-button tool-button-labeled"
            type="button"
            title="Ordenar, añadir o eliminar páginas"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-organize"></use></svg>
            <span>Ordenar PDF</span>
          </button>
          <button
            id="sign-btn"
            class="tool-button tool-button-labeled"
            type="button"
            title="Añadir una firma manuscrita visible"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-signature"></use></svg>
            <span>Firmar PDF</span>
          </button>
        </div>

        <div class="toolbar-spacer" aria-hidden="true"></div>

        <nav class="toolbar-group page-controls" aria-label="Navegación de páginas">
          <button id="prev-page-btn" class="tool-button" type="button" title="Página anterior" aria-label="Página anterior" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
          </button>
          <label class="page-field">
            <span class="visually-hidden">Página actual</span>
            <input id="page-input" type="number" min="1" value="1" inputmode="numeric" aria-label="Página actual" />
          </label>
          <span id="page-total" class="page-total" aria-label="Total de páginas">de 0</span>
          <button id="next-page-btn" class="tool-button" type="button" title="Página siguiente" aria-label="Página siguiente" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
          </button>
        </nav>

        <div class="toolbar-group zoom-controls" aria-label="Zoom">
          <button id="zoom-out-btn" class="tool-button" type="button" title="Alejar" aria-label="Alejar">
            <svg class="icon" aria-hidden="true"><use href="#i-minus"></use></svg>
          </button>
          <output id="zoom-value" class="zoom-value" aria-live="polite">100%</output>
          <button id="zoom-in-btn" class="tool-button" type="button" title="Acercar" aria-label="Acercar">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
          </button>
          <button id="fit-btn" class="tool-button" type="button" title="Ajustar a la ventana" aria-label="Ajustar a la ventana">
            <svg class="icon" aria-hidden="true"><use href="#i-fit"></use></svg>
          </button>
        </div>

        <div class="toolbar-group search-control" role="search">
          <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"></use></svg>
          <label class="visually-hidden" for="search-input">Buscar en el documento</label>
          <input
            id="search-input"
            type="search"
            placeholder="Buscar"
            autocomplete="off"
            spellcheck="false"
          />
          <output id="search-count" for="search-input" aria-live="polite">0/0</output>
        </div>
      </div>

      <main id="main-content" class="main-content">
        <section id="welcome-screen" class="welcome-screen" aria-labelledby="welcome-title">
          <div class="native-tools" aria-labelledby="welcome-title">
            <span class="eyebrow">Herramientas PDF</span>
            <h1 id="welcome-title">Trabaja con tus archivos</h1>
            <div class="tool-launcher">
              <button id="merge-pdf-btn" class="welcome-tool" type="button">
                <svg class="icon" aria-hidden="true"><use href="#i-merge"></use></svg>
                <span><strong>Unir archivos PDF</strong><small>Combina y ordena varios PDF.</small></span>
              </button>
              <button id="split-pdf-btn" class="welcome-tool" type="button">
                <svg class="icon" aria-hidden="true"><use href="#i-split"></use></svg>
                <span><strong>Dividir PDF</strong><small>Extrae rangos o separa cada página.</small></span>
              </button>
              <button id="compress-pdf-btn" class="welcome-tool" type="button">
                <svg class="icon" aria-hidden="true"><use href="#i-compress"></use></svg>
                <span><strong>Comprimir PDF</strong><small>Optimiza sin perder calidad.</small></span>
              </button>
              <button id="pdfa4-pdf-btn" class="welcome-tool" type="button">
                <svg class="icon" aria-hidden="true"><use href="#i-document"></use></svg>
                <span><strong>Convertir a PDF/A-4</strong><small>Crea una copia visual para archivo.</small></span>
              </button>
              <button id="to-pdf-btn" class="welcome-tool" type="button">
                <svg class="icon" aria-hidden="true"><use href="#i-convert"></use></svg>
                <span><strong>Convertir a PDF</strong><small>Word, PowerPoint, Excel o JPG.</small></span>
              </button>
              <button id="unlock-pdf-btn" class="welcome-tool" type="button">
                <svg class="icon" aria-hidden="true"><use href="#i-unlock"></use></svg>
                <span><strong>Desbloquear PDF</strong><small>Quita la contraseña del documento.</small></span>
              </button>
              <button id="protect-pdf-btn" class="welcome-tool" type="button">
                <svg class="icon" aria-hidden="true"><use href="#i-lock"></use></svg>
                <span><strong>Proteger PDF</strong><small>Añade una contraseña AES-256.</small></span>
              </button>
            </div>
          </div>

          <label id="drop-zone" class="drop-zone" for="file-input" tabindex="0">
            <span class="drop-illustration" aria-hidden="true">
              <svg class="drop-document"><use href="#i-document"></use></svg>
              <svg class="drop-feather"><use href="#i-feather"></use></svg>
            </span>
            <span class="drop-title">Suelta un archivo aquí</span>
            <span class="drop-subtitle">PDF, PPT, PPTX u OpenDocument · también puedes</span>
            <span id="welcome-open-btn" class="drop-cta">Elegir un archivo</span>
          </label>

        </section>

        <section id="document-workspace" class="document-workspace" aria-label="Documento abierto" hidden>
          <div id="viewer" class="viewer" tabindex="0" aria-label="Área del documento">
            <div id="pdf-viewer" class="pdf-viewer" aria-label="Visor PDF" hidden>
              <article
                id="pdf-page"
                class="pdf-page"
                data-page-number="1"
                aria-label="Página 1"
              >
                <canvas id="pdf-canvas" class="pdf-canvas" width="816" height="1056"></canvas>
                <div id="text-layer" class="text-layer" aria-label="Texto seleccionable"></div>
                <div
                  id="form-layer"
                  class="form-layer"
                  aria-label="Campos rellenables del documento"
                ></div>
                <div id="links-layer" class="links-layer annotationLayer" aria-label="Enlaces del documento"></div>
                <svg
                  id="annotation-overlay"
                  class="annotation-overlay"
                  xmlns="http://www.w3.org/2000/svg"
                  aria-label="Anotaciones"
                ></svg>
              </article>
            </div>

            <div id="pptx-viewer" class="pptx-viewer" aria-label="Visor de presentación" hidden>
              <div class="pptx-stage">
                <canvas id="pptx-canvas" class="pptx-canvas" width="1280" height="720"></canvas>
              </div>
            </div>
          </div>
        </section>
      </main>

      <footer id="statusbar" class="statusbar">
        <div id="status-primary" class="status-primary" hidden>
          <span id="status-indicator" class="status-indicator" aria-hidden="true"></span>
          <span id="status-message" role="status" aria-live="polite"></span>
        </div>
        <div class="status-meta">
          <span id="document-stats"></span>
          <span class="shortcut-hint"><kbd>Ctrl</kbd> + <kbd>O</kbd> para abrir</span>
        </div>
      </footer>
    </div>

    <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite" hidden>
      <div class="loading-card">
        <span class="spinner" aria-hidden="true"></span>
        <span id="loading-message">Abriendo documento…</span>
        <span id="loading-detail" class="loading-detail">Esto debería tardar solo un momento</span>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden>
      <svg class="icon toast-icon" aria-hidden="true"><use href="#i-check"></use></svg>
      <span id="toast-message">Cambios guardados</span>
      <button id="toast-close-btn" class="toast-close" type="button" aria-label="Cerrar aviso">
        <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
      </button>
    </div>

    <form id="text-entry-editor" class="text-entry-editor" autocomplete="off" hidden>
      <label class="visually-hidden" for="text-entry-input">Texto de la anotación</label>
      <textarea
        id="text-entry-input"
        rows="2"
        placeholder="Escribe una nota…"
        spellcheck="true"
      ></textarea>
      <div class="text-entry-actions">
        <button id="text-entry-cancel" class="mini-button" type="button">Cancelar</button>
        <button id="text-entry-confirm" class="mini-button mini-button-primary" type="submit">Añadir</button>
      </div>
    </form>

    <dialog id="tool-dialog" class="tool-dialog" aria-labelledby="tool-dialog-title">
      <form id="tool-dialog-form" method="dialog">
        <header class="tool-dialog-header">
          <div>
            <h2 id="tool-dialog-title"></h2>
            <p id="tool-dialog-description"></p>
          </div>
          <button id="tool-dialog-close" class="toast-close dialog-close" type="button" aria-label="Cerrar">
            <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
          </button>
        </header>
        <div id="tool-dialog-body" class="tool-dialog-body"></div>
        <footer class="tool-dialog-actions">
          <button id="tool-dialog-cancel" class="button button-secondary" type="button">Cancelar</button>
          <button id="tool-dialog-primary" class="button dialog-primary" type="submit">Continuar</button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
